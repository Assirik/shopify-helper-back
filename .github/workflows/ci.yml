# Vérifie que le backend compile et que les tests passent, sur chaque PR et chaque push
# vers dev/main. Les tests n'utilisent ni MongoDB ni Redis (modèles et files mockés), et
# toutes les variables d'environnement ont une valeur par défaut : aucun secret requis.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Même version que les images Docker (Dockerfile, dev.Dockerfile).
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check & build
        run: npm run build

      - name: Tests
        run: npm test
